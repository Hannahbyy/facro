{% extends "layout.html" %}

{% block title %}Dashboard{% endblock %}

{% block main %}
    <h1 class="mb-4">Captured Faces</h1>
    <table class="table table-striped table-hover align-middle">
        <thead>
            <tr>
                <th>Face</th>
                <th>Timestamp</th>
                <th>Frame</th>
            </tr>
        </thead>
        <tbody>
            {% if rows %}
                {% for row in rows %}
                <tr>
                    <td><img src="{{ url_for('static', filename=row[0]) }}" style="width: 80px; border-radius: 6px;"></td>
                    <td>{{ row[1] }}s</td>
                    <td>{{ row[2] }}</td>
                </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="3" class="text-center text-muted">No faces detected yet</td>
                </tr>
            {% endif %}
        </tbody>
    </table>
{% endblock %}
